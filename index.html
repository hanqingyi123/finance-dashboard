<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>金融看板</title>
<style>
  :root { --bg:#0f1420; --card:#1a2130; --card-2:#202a3d; --text:#e8ecf4; --muted:#8b96ab; --accent:#4f8cff; --accent-2:#34d399; --danger:#f87171; --border:#2b3650; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:16px 14px 80px; }
  .wrap { max-width:560px; margin:0 auto; }
  header { margin-bottom:14px; }
  header h1 { margin:0 0 4px; font-size:19px; }
  header .sub { color:var(--muted); font-size:11px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:15px; margin-bottom:12px; }
  .card h2 { margin:0 0 10px; font-size:12px; font-weight:600; color:var(--muted); letter-spacing:1px; }
  .big { text-align:center; padding:2px 0 8px; }
  .big .v { font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; }
  .big .k { font-size:11px; color:var(--muted); margin-top:3px; }
  .gain-row { display:flex; justify-content:center; gap:22px; margin-top:6px; }
  .gain-row .g { text-align:center; }
  .gain-row .g .v { font-size:15px; font-weight:600; }
  .gain-row .g .k { font-size:10px; color:var(--muted); }
  .pos { color:var(--accent-2); } .neg { color:var(--danger); }
  .row { display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid rgba(43,54,80,.5); font-size:13px; }
  .row:last-child { border-bottom:none; }
  .row .l { color:var(--text); }
  .row .l .code { font-size:10px; color:#5b6780; margin-left:5px; }
  .row .r { font-variant-numeric:tabular-nums; }
  .cat-bar { display:flex; align-items:center; gap:8px; margin:7px 0; }
  .cat-bar .name { width:50px; font-size:12px; color:var(--muted); flex-shrink:0; }
  .cat-bar .bar { flex:1; height:7px; background:var(--card-2); border-radius:4px; overflow:hidden; }
  .cat-bar .bar i { display:block; height:100%; background:var(--accent); border-radius:4px; }
  .cat-bar .amt { font-size:12px; font-variant-numeric:tabular-nums; }
  .empty { color:#5b6780; text-align:center; padding:12px 0; font-size:12px; }
  .field { margin-bottom:11px; }
  .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:5px; }
  .field input, .field select { width:100%; background:var(--card-2); border:1px solid var(--border); border-radius:9px; color:var(--text); font-size:15px; padding:10px 11px; outline:none; }
  .field input:focus, .field select:focus { border-color:var(--accent); }
  .btn { display:block; width:100%; border:none; border-radius:10px; padding:13px; background:var(--accent-2); color:#06281c; font-size:15px; font-weight:700; cursor:pointer; }
  .btn:active { opacity:.85; }
  .msg { text-align:center; font-size:12px; margin-top:9px; min-height:16px; }
  .msg.ok { color:var(--accent-2); } .msg.err { color:var(--danger); }
  .tip { color:#5b6780; font-size:10px; text-align:center; margin-top:8px; }

  .tabbar { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--border); display:flex; z-index:99; }
  .tab { flex:1; text-align:center; padding:10px 2px 12px; font-size:11px; color:var(--muted); cursor:pointer; }
  .tab.on { color:var(--accent); }
  .tab i { display:block; font-style:normal; font-size:17px; margin-bottom:2px; }
  .page { display:none; }
  .page.on { display:block; }
  .cats { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-bottom:10px; }
  .cat { background:var(--card-2); border:1px solid var(--border); border-radius:8px; color:var(--muted); font-size:13px; padding:9px 2px; text-align:center; cursor:pointer; }
  .cat.on { border-color:var(--accent); color:var(--accent); background:rgba(79,140,255,.12); }
  .accs { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:10px; }
  .acc { background:var(--card-2); border:1px solid var(--border); border-radius:8px; color:var(--muted); font-size:11px; padding:9px 2px; text-align:center; cursor:pointer; }
  .acc.on { border-color:var(--accent); color:var(--accent); background:rgba(79,140,255,.12); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>金融看板</h1>
    <div class="sub" id="updated">加载中…</div>
  </header>

  <!-- 看板 -->
  <div class="page on" id="page-dashboard">
    <div class="card">
      <div class="big"><div class="v" id="totalValue">—</div><div class="k">总资产</div></div>
      <div class="gain-row">
        <div class="g"><div class="v pos" id="gain">—</div><div class="k">累计收益</div></div>
        <div class="g"><div class="v" id="gainRate">—</div><div class="k">年化 XIRR</div></div>
      </div>
    </div>
    <div class="card"><h2>现金账户</h2><div id="cashList"></div></div>
    <div class="card"><h2>基金持仓</h2><div id="fundList"></div></div>
    <div class="card"><h2>本月消费</h2><div class="big" style="padding:0"><div class="v" id="monthExp" style="font-size:24px">—</div></div><div id="catList"></div></div>
    <div class="card"><h2>最近消费</h2><div id="expList"></div></div>
    <div class="tip">手机录入会立即反映；电脑刷新后正式入账并更新快照</div>
  </div>

  <!-- 记消费 -->
  <div class="page" id="page-expense">
    <div class="card">
      <h2>记一笔消费</h2>
      <div class="field"><label>金额</label><input type="number" id="expAmt" inputmode="decimal" step="0.01" placeholder="0.00"></div>
      <div class="cats" id="expCats"></div>
      <div class="accs" id="expAccs"></div>
      <div class="field"><label>备注（可选）</label><input type="text" id="expNote" placeholder="如 王繁星面馆"></div>
      <button class="btn" id="expSave">保存</button>
      <div class="msg" id="expMsg"></div>
    </div>
  </div>

  <!-- 买基金 -->
  <div class="page" id="page-buy">
    <div class="card">
      <h2>买基金</h2>
      <div class="field"><label>基金代码</label><input type="text" id="buyCode" list="fundList" placeholder="如 021000 / 017641 / 518880" spellcheck="false"></div>
      <datalist id="fundDatalist">
        <option value="021000.OF">南方纳指</option>
        <option value="017641.OF">摩根标普500</option>
        <option value="518880.SH">华安黄金ETF</option>
        <option value="003376.OF">广发国开债</option>
      </datalist>
      <div class="field"><label>金额</label><input type="number" id="buyAmt" inputmode="decimal" step="0.01" placeholder="0.00"></div>
      <div class="accs" id="buyAccs"></div>
      <div class="field"><label>份额（可空=在途）</label><input type="number" id="buyShares" inputmode="decimal" step="0.01" placeholder="留空"></div>
      <div class="field"><label>净值（可空）</label><input type="number" id="buyNav" inputmode="decimal" step="0.0001" placeholder="留空"></div>
      <div class="field"><label>申购费（可空）</label><input type="number" id="buyFee" inputmode="decimal" step="0.01" placeholder="0"></div>
      <button class="btn" id="buySave">保存</button>
      <div class="msg" id="buyMsg"></div>
    </div>
  </div>

  <!-- 工资 -->
  <div class="page" id="page-salary">
    <div class="card">
      <h2>录工资</h2>
      <div class="field"><label>月份</label><input type="month" id="salMonth"></div>
      <div class="field"><label>到手工资</label><input type="number" id="salAmt" inputmode="decimal" step="0.01" placeholder="15000"></div>
      <div class="field"><label>储蓄与投资（入银行卡7978）</label><input type="number" id="salSaving" inputmode="decimal" step="0.01" placeholder="12000"></div>
      <div class="tip">剩余（到手−储蓄）自动入微信零钱</div>
      <button class="btn" id="salSave">保存</button>
      <div class="msg" id="salMsg"></div>
    </div>
  </div>

  <!-- 转账 -->
  <div class="page" id="page-transfer">
    <div class="card">
      <h2>转账</h2>
      <div class="field"><label>转出</label><select id="trfFrom"></select></div>
      <div class="field"><label>转入</label><select id="trfTo"></select></div>
      <div class="field"><label>金额</label><input type="number" id="trfAmt" inputmode="decimal" step="0.01" placeholder="0.00"></div>
      <div class="field"><label>备注（可选）</label><input type="text" id="trfNote" placeholder="如 还信用卡"></div>
      <button class="btn" id="trfSave">保存</button>
      <div class="msg" id="trfMsg"></div>
    </div>
  </div>

  <!-- 其他收入 -->
  <div class="page" id="page-income">
    <div class="card">
      <h2>记收入</h2>
      <div class="field"><label>金额</label><input type="number" id="incAmt" inputmode="decimal" step="0.01" placeholder="0.00"></div>
      <div class="accs" id="incAccs"></div>
      <div class="field"><label>分类</label>
        <select id="incCat"><option value="顺风车">顺风车</option><option value="父母额外给付">父母额外给付</option><option value="其他收入">其他收入</option></select>
      </div>
      <div class="field"><label>备注（可选）</label><input type="text" id="incNote" placeholder=""></div>
      <button class="btn" id="incSave">保存</button>
      <div class="msg" id="incMsg"></div>
    </div>
  </div>
</div>

<div class="tabbar">
  <div class="tab on" data-page="dashboard"><i>📊</i>看板</div>
  <div class="tab" data-page="expense"><i>💸</i>记账</div>
  <div class="tab" data-page="buy"><i>📈</i>买基</div>
  <div class="tab" data-page="salary"><i>💰</i>工资</div>
  <div class="tab" data-page="transfer"><i>🔁</i>转账</div>
  <div class="tab" data-page="income"><i>➕</i>收入</div>
</div>

<script>
var GIST_ID = 'be08b8c65fb4b278f60f7c879a7f0200';
var token = new URLSearchParams(location.search).get('token');
var ACCOUNTS = ['微信零钱', '银行卡 7978', '银行卡 5833', '宏利货币B'];
var CASH_ACCOUNTS = ['微信零钱', '银行卡 7978', '银行卡 5833'];

function fmt(n) { return '¥ ' + (Math.round(n * 100) / 100).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtShort(n) { return '¥ ' + (Math.round(n * 100) / 100).toLocaleString('zh-CN', { maximumFractionDigits: 2 }); }
function round2(n) { return Math.round(n * 100) / 100; }
function today() { var d = new Date(); var p=function(x){return (x<10?'0':'')+x;}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }

function gh(method, path, body) {
  return fetch('https://api.github.com/gists' + path, {
    method: method,
    headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  }).then(function (r) { return r.json(); });
}

function parseExp(s) { var p = s.split(','); return { date:p[0], amount:parseFloat(p[1]), category:(p[2]||'').trim(), account:(p[3]||'').trim()||'微信零钱', note:p.slice(4).join(',').trim() }; }
function parseBuy(s) { var p = s.split(','); return { code:p[0].trim(), amount:parseFloat(p[1]), source:(p[2]||'').trim()||'银行卡 7978', date:(p[3]||'').trim()||today(), shares:parseFloat(p[4])||0, nav:parseFloat(p[5])||0, fee:parseFloat(p[6])||0 }; }
function parseSal(s) { var p = s.split(','); return { month:p[0], amount:parseFloat(p[1]), saving:parseFloat(p[2])||0 }; }
function parseTrf(s) { var p = s.split(','); return { date:p[0], from:p[1], to:p[2], amount:parseFloat(p[3]), note:p.slice(4).join(',').trim() }; }
function parseInc(s) { var p = s.split(','); return { date:p[0], amount:parseFloat(p[1]), account:(p[2]||'').trim()||'银行卡 7978', category:(p[3]||'').trim()||'其他收入', note:p.slice(4).join(',').trim() }; }

var state = { snapshot: {}, pending: { expenses: [], buys: [], salaries: [], transfers: [], incomes: [] } };

function loadAll() {
  return gh('GET', '/' + GIST_ID).then(function (j) {
    var files = j.files || {};
    var snapshot = {};
    try { snapshot = JSON.parse(files['dashboard.json'].content); } catch (e) {}
    var pending = { expenses: [], buys: [], salaries: [], transfers: [], incomes: [] };
    Object.keys(files).forEach(function (name) {
      var c = files[name].content || '';
      if (name.indexOf('exp_') === 0) pending.expenses.push(parseExp(c));
      else if (name.indexOf('buy_') === 0) pending.buys.push(parseBuy(c));
      else if (name.indexOf('sal_') === 0) pending.salaries.push(parseSal(c));
      else if (name.indexOf('trf_') === 0) pending.transfers.push(parseTrf(c));
      else if (name.indexOf('inc_') === 0) pending.incomes.push(parseInc(c));
    });
    state.snapshot = snapshot; state.pending = pending;
    return state;
  });
}

function addPending(prefix, content, cb) {
  var files = {};
  files[prefix + Date.now() + '.json'] = { content: content };
  gh('PATCH', '/' + GIST_ID, { files: files }).then(function () {
    loadAll().then(function () { renderDashboard(); if (cb) cb(); });
  });
}

function renderDashboard() {
  var snap = state.snapshot, pend = state.pending;
  var prices = snap.prices || {};
  var cash = JSON.parse(JSON.stringify(snap.cash || []));
  var expenses = (snap.expenses || []).concat(pend.expenses);
  var income = (snap.income || []).concat(pend.incomes);
  var transfers = (snap.transfers || []).concat(pend.transfers);

  // 叠加 pending 到现金
  function cashAcc(name) { var c = cash.filter(function (x) { return x.name === name; })[0]; if (!c) { c = { name: name, amount: 0 }; cash.push(c); } return c; }
  pend.expenses.forEach(function (e) { var c = cashAcc(e.account); c.amount = round2(c.amount - e.amount); });
  pend.buys.forEach(function (b) { var c = cashAcc(b.source); c.amount = round2(c.amount - b.amount); });
  pend.salaries.forEach(function (s) { cashAcc('银行卡 7978').amount = round2(cashAcc('银行卡 7978').amount + s.saving); cashAcc('微信零钱').amount = round2(cashAcc('微信零钱').amount + round2(s.amount - s.saving)); });
  pend.transfers.forEach(function (t) { cashAcc(t.from).amount = round2(cashAcc(t.from).amount - t.amount); cashAcc(t.to).amount = round2(cashAcc(t.to).amount + t.amount); });
  pend.incomes.forEach(function (i) { cashAcc(i.account).amount = round2(cashAcc(i.account).amount + i.amount); });

  // 持仓
  var holdings = {};
  (snap.transactions || []).forEach(function (t) {
    if (t.type === 'money') return;
    if (!holdings[t.code]) holdings[t.code] = { name: t.name, shares: 0, cost: 0, pending: 0 };
    if (t.status === 'pending') holdings[t.code].pending += t.amount;
    else if (t.direction === 'buy') { holdings[t.code].shares += (t.shares || 0); holdings[t.code].cost += t.amount; }
  });
  pend.buys.forEach(function (b) {
    var name = b.code;
    if (!holdings[b.code]) holdings[b.code] = { name: name, shares: 0, cost: 0, pending: 0 };
    if (b.shares > 0) { holdings[b.code].shares += b.shares; holdings[b.code].cost += b.amount; }
    else holdings[b.code].pending += b.amount;
  });

  var fundValue = 0, fundCost = 0, pendingTotal = 0, moneyAmt = 0, moneyCost = 0;
  Object.keys(holdings).forEach(function (code) {
    var h = holdings[code];
    var nav = prices[code] ? prices[code].nav : 0;
    fundValue += h.shares * nav;
    fundCost += h.cost;
    pendingTotal += h.pending;
  });
  cash.forEach(function (c) { if (c.name === '宏利货币B') { moneyAmt = c.amount || 0; moneyCost = c.cost || 0; } });
  var investValue = fundValue + pendingTotal + moneyAmt;
  var investCost = fundCost + pendingTotal + moneyCost;
  var gain = investValue - investCost;
  var cashTotal = 0; cash.forEach(function (c) { cashTotal += (c.amount || 0); });
  var totalValue = fundValue + pendingTotal + cashTotal;

  document.getElementById('updated').textContent = '更新于 ' + (snap.updated || '—') + (pend.expenses.length + pend.buys.length + pend.salaries.length + pend.transfers.length + pend.incomes.length > 0 ? ' · 有未同步记录' : '');
  document.getElementById('totalValue').textContent = fmt(totalValue);
  var gainEl = document.getElementById('gain');
  gainEl.textContent = (gain >= 0 ? '+' : '') + fmt(gain);
  gainEl.className = 'v ' + (gain >= 0 ? 'pos' : 'neg');
  var rateEl = document.getElementById('gainRate');
  var x = snap.xirr;
  if (x == null) { rateEl.textContent = '—'; rateEl.className = 'v'; }
  else { rateEl.textContent = (x >= 0 ? '+' : '') + (x * 100).toFixed(1) + '%'; rateEl.className = 'v ' + (x >= 0 ? 'pos' : 'neg'); }

  // 现金账户（活钱）
  var cashHtml = '';
  CASH_ACCOUNTS.forEach(function (name) { var c = cashAcc(name); cashHtml += '<div class="row"><span class="l">' + name + '</span><span class="r">' + fmt(c.amount) + '</span></div>'; });
  cashHtml += '<div class="row"><span class="l">宏利货币B<span class="code">货基</span></span><span class="r">' + fmt(moneyAmt) + '</span></div>';
  document.getElementById('cashList').innerHTML = cashHtml;

  // 基金持仓
  var fundHtml = '';
  Object.keys(holdings).forEach(function (code) {
    var h = holdings[code];
    var nav = prices[code] ? prices[code].nav : 0;
    var mv = h.shares * nav;
    var g = mv - h.cost;
    fundHtml += '<div class="row"><span class="l">' + h.name + '<span class="code">' + code + '</span></span><span class="r">' + fmt(mv) + ' <span class="' + (g >= 0 ? 'pos' : 'neg') + '" style="font-size:11px">' + (g >= 0 ? '+' : '') + fmtShort(g) + '</span></span></div>';
    if (h.pending > 0) fundHtml += '<div class="row"><span class="l">↳ 在途</span><span class="r">' + fmt(h.pending) + '</span></div>';
  });
  document.getElementById('fundList').innerHTML = fundHtml || '<div class="empty">暂无持仓</div>';

  // 本月消费
  var month = (snap.updated || today()).slice(0, 7);
  var monthTotal = 0, catMap = {};
  expenses.forEach(function (e) { if (e.date && e.date.slice(0, 7) === month) { monthTotal += e.amount; catMap[e.category] = (catMap[e.category] || 0) + e.amount; } });
  document.getElementById('monthExp').textContent = fmt(monthTotal);
  var cats = Object.keys(catMap).sort(function (a, b) { return catMap[b] - catMap[a]; });
  var catHtml = '';
  cats.forEach(function (c) { var pct = monthTotal > 0 ? catMap[c] / monthTotal * 100 : 0; catHtml += '<div class="cat-bar"><span class="name">' + c + '</span><span class="bar"><i style="width:' + pct.toFixed(1) + '%"></i></span><span class="amt">' + fmtShort(catMap[c]) + ' <span style="font-size:10px;color:#5b6780">' + pct.toFixed(1) + '%</span></span></div>'; });
  document.getElementById('catList').innerHTML = catHtml || '<div class="empty">本月暂无消费</div>';

  // 最近消费
  var recent = expenses.slice().sort(function (a, b) { return b.date < a.date ? -1 : (b.date > a.date ? 1 : 0); }).slice(0, 8);
  var expHtml = '';
  recent.forEach(function (e) { expHtml += '<div class="row"><span class="l">' + (e.date || '').slice(5) + ' ' + e.category + (e.note ? '<span class="code">' + e.note + '</span>' : '') + '</span><span class="r">' + fmt(e.amount) + '</span></div>'; });
  document.getElementById('expList').innerHTML = expHtml || '<div class="empty">暂无消费</div>';
}

// 底部导航
document.querySelectorAll('.tab').forEach(function (tab) {
  tab.addEventListener('click', function () {
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('on'); });
    document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('on'); });
    tab.classList.add('on');
    document.getElementById('page-' + tab.dataset.page).classList.add('on');
  });
});

// 分类/账户选择按钮
function renderSelectors() {
  var cats = (state.snapshot.expenseCategories || ['餐饮','交通','购物','居住','医疗','娱乐','其他','定期费用','开发','提升']);
  function buildCat(containerId, defaultIdx) {
    var el = document.getElementById(containerId); el.innerHTML = '';
    cats.forEach(function (c, i) { var d = document.createElement('div'); d.className = 'cat' + (i === defaultIdx ? ' on' : ''); d.textContent = c; d.dataset.val = c; el.appendChild(d); });
    el.querySelectorAll('.cat').forEach(function (d) { d.addEventListener('click', function () { el.querySelectorAll('.cat').forEach(function (x) { x.classList.remove('on'); }); d.classList.add('on'); }); });
  }
  buildCat('expCats', 0);
  function buildAcc(containerId, includeAll) {
    var el = document.getElementById(containerId); el.innerHTML = '';
    var accs = includeAll ? ACCOUNTS : CASH_ACCOUNTS;
    accs.forEach(function (a, i) { var d = document.createElement('div'); d.className = 'acc' + (i === (includeAll ? 0 : 1) ? ' on' : ''); d.textContent = a; d.dataset.val = a; el.appendChild(d); });
    el.querySelectorAll('.acc').forEach(function (d) { d.addEventListener('click', function () { el.querySelectorAll('.acc').forEach(function (x) { x.classList.remove('on'); }); d.classList.add('on'); }); });
  }
  buildAcc('expAccs', false);
  buildAcc('buyAccs', false);
  buildAcc('incAccs', true);
  // 转账下拉
  var trfFrom = document.getElementById('trfFrom'), trfTo = document.getElementById('trfTo');
  trfFrom.innerHTML = ''; trfTo.innerHTML = '';
  ACCOUNTS.forEach(function (a) { var o1 = document.createElement('option'); o1.value = a; o1.textContent = a; trfFrom.appendChild(o1); var o2 = document.createElement('option'); o2.value = a; o2.textContent = a; trfTo.appendChild(o2); });
  trfFrom.value = '银行卡 7978'; trfTo.value = '微信零钱';
  document.getElementById('salMonth').value = (state.snapshot.updated || today()).slice(0, 7);
}

function selVal(containerId) { var el = document.querySelector('#' + containerId + ' .on'); return el ? el.dataset.val : null; }
function msg(id, text, ok) { var el = document.getElementById(id); el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'err'); }

// 记消费
document.getElementById('expSave').addEventListener('click', function () {
  var amount = parseFloat(document.getElementById('expAmt').value);
  if (!amount || amount <= 0) { msg('expMsg', '请输入金额', false); return; }
  var category = selVal('expCats'), account = selVal('expAccs');
  if (!category || !account) { msg('expMsg', '请选分类和账户', false); return; }
  var content = today() + ',' + amount + ',' + category + ',' + account + ',' + (document.getElementById('expNote').value.trim() || '');
  addPending('exp_', content, function () { msg('expMsg', '已记 ' + category + ' ' + amount + ' 元', true); document.getElementById('expAmt').value = ''; document.getElementById('expNote').value = ''; });
});

// 买基金
document.getElementById('buySave').addEventListener('click', function () {
  var code = document.getElementById('buyCode').value.trim();
  var amount = parseFloat(document.getElementById('buyAmt').value);
  if (!code || !amount || amount <= 0) { msg('buyMsg', '请输入代码和金额', false); return; }
  var source = selVal('buyAccs');
  if (!source) { msg('buyMsg', '请选来源', false); return; }
  var shares = parseFloat(document.getElementById('buyShares').value) || 0;
  var nav = parseFloat(document.getElementById('buyNav').value) || 0;
  var fee = parseFloat(document.getElementById('buyFee').value) || 0;
  var content = code + ',' + amount + ',' + source + ',' + today() + ',' + shares + ',' + nav + ',' + fee;
  addPending('buy_', content, function () { msg('buyMsg', '已记买入 ' + code + ' ' + amount + ' 元', true); document.getElementById('buyAmt').value = ''; document.getElementById('buyShares').value = ''; document.getElementById('buyNav').value = ''; document.getElementById('buyFee').value = ''; });
});

// 工资
document.getElementById('salSave').addEventListener('click', function () {
  var month = document.getElementById('salMonth').value;
  var amount = parseFloat(document.getElementById('salAmt').value);
  var saving = parseFloat(document.getElementById('salSaving').value) || 0;
  if (!month || !amount || amount <= 0) { msg('salMsg', '请填写月份和金额', false); return; }
  if (saving > amount) { msg('salMsg', '储蓄不能大于到手', false); return; }
  var content = month + ',' + amount + ',' + saving;
  addPending('sal_', content, function () { msg('salMsg', '已录 ' + month + ' 工资', true); document.getElementById('salAmt').value = ''; document.getElementById('salSaving').value = ''; });
});

// 转账
document.getElementById('trfSave').addEventListener('click', function () {
  var from = document.getElementById('trfFrom').value, to = document.getElementById('trfTo').value;
  var amount = parseFloat(document.getElementById('trfAmt').value);
  if (!from || !to || from === to || !amount || amount <= 0) { msg('trfMsg', '请填写转出/转入和金额', false); return; }
  var content = today() + ',' + from + ',' + to + ',' + amount + ',' + (document.getElementById('trfNote').value.trim() || '');
  addPending('trf_', content, function () { msg('trfMsg', '已转账 ' + from + ' → ' + to + ' ' + amount + ' 元', true); document.getElementById('trfAmt').value = ''; document.getElementById('trfNote').value = ''; });
});

// 其他收入
document.getElementById('incSave').addEventListener('click', function () {
  var amount = parseFloat(document.getElementById('incAmt').value);
  if (!amount || amount <= 0) { msg('incMsg', '请输入金额', false); return; }
  var account = selVal('incAccs'), category = document.getElementById('incCat').value;
  if (!account) { msg('incMsg', '请选账户', false); return; }
  var content = today() + ',' + amount + ',' + account + ',' + category + ',' + (document.getElementById('incNote').value.trim() || '');
  addPending('inc_', content, function () { msg('incMsg', '已记 ' + category + ' ' + amount + ' 元', true); document.getElementById('incAmt').value = ''; document.getElementById('incNote').value = ''; });
});

// 初始化
if (!token) {
  document.getElementById('updated').textContent = '缺少访问密钥（token），请用完整网址打开';
} else {
  loadAll().then(function () { renderDashboard(); renderSelectors(); }).catch(function (e) { document.getElementById('updated').textContent = '加载失败：' + e.message; });
}
</script>
</body>
</html>
